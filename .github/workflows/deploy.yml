name: Deploy Web Catalog to Firebase Hosting

on:
  push:
    branches:
      - main
  schedule:
    # Automatically rebuild and deploy every 15 minutes to fetch new movies/series from Firestore
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Catalog
        run: npm run build

      - name: Deploy to Firebase Hosting Live Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAMA_PRO_33FF6 }}'
          channelId: live
          projectId: drama-pro-33ff6
